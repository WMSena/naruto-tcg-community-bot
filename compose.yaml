version: "3.9"
services:

  kage:
    image: mongo:7
    container_name: kage
    hostname: kage
    restart: unless-stopped
    env_file:
      - ./core/mongo/.env
    environment:
      MONGO_INITDB_DATABASE: "narutotcg"
    volumes:
      - kage-data:/data/db
    # Reachable on the VPS IP:27017 (Compass). Require a password in core/mongo/.env.
    ports:
      - "27017:27017"
    networks:
      - naruto-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'db.adminCommand({ ping: 1 })'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  discord-bot:
    container_name: naruto-discord-bot
    build:
      context: .
      dockerfile: services/discord-bot/Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/discord-bot/.env
    volumes:
      - ./services/discord-bot:/app/services/discord-bot
      - ./core:/app/core
    depends_on:
      kage:
        condition: service_healthy
    networks:
      - naruto-network
volumes:
  kage-data:
networks:
  naruto-network:
    external: true