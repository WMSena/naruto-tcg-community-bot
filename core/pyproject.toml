[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naruto-core"
version = "0.1.0"
description = "Core shared libraries for the Naruto Bot ecosystem"
requires-python = ">=3.13"

dependencies = [
    "pymongo>=4.17.0",
    "python-dotenv>=1.1.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]